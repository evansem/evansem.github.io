name: badge probe
on:
  push:
    branches: [claude/tmp-badge-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - run: curl -sSfL "https://images.credly.com/size/340x340/images/2ca15936-bd13-4db9-86cb-8da72a71d701/image.png" -o badge.png && mkdir -p out && cp badge.png out/original.png
      - name: analyse and fill interior
        shell: python
        run: |
          import sys, os
          os.makedirs("out", exist_ok=True)
          sys.stdout = open("out/report.txt", "w")
          from PIL import Image
          from collections import deque
          import base64, io
          im = Image.open("badge.png").convert("RGBA")
          w, h = im.size
          px = im.load()
          print("size", w, h, "bbox", im.getchannel("A").getbbox())
          corners = [px[0,0], px[w-1,0], px[0,h-1], px[w-1,h-1], px[w//2,h//2]]
          print("corners+center", corners)
          # outside = transparent pixels connected to the image border
          out = [[False]*w for _ in range(h)]
          q = deque()
          for x in range(w):
              for y in (0, h-1):
                  if px[x,y][3] < 128 and not out[y][x]: out[y][x] = True; q.append((x,y))
          for y in range(h):
              for x in (0, w-1):
                  if px[x,y][3] < 128 and not out[y][x]: out[y][x] = True; q.append((x,y))
          while q:
              x, y = q.popleft()
              for nx, ny in ((x+1,y),(x-1,y),(x,y+1),(x,y-1)):
                  if 0 <= nx < w and 0 <= ny < h and not out[ny][nx] and px[nx,ny][3] < 128:
                      out[ny][nx] = True; q.append((nx,ny))
          inside_transparent = 0
          res = im.copy(); rp = res.load()
          for y in range(h):
              for x in range(w):
                  if not out[y][x]:
                      r,g,b,a = px[x,y]
                      if a < 255:
                          inside_transparent += 1
                          f = a/255
                          rp[x,y] = (round(r*f+255*(1-f)), round(g*f+255*(1-f)), round(b*f+255*(1-f)), 255)
          print("interior non-opaque pixels filled:", inside_transparent)
          # coarse alpha map, 34x34
          for y in range(0, h, 10):
              print("".join("#" if px[x,y][3]>200 else ("+" if px[x,y][3]>20 else ".") for x in range(0, w, 10)))
          res.save("out/filled.png", optimize=True)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add out && git commit -m "probe output" && git push
